<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1726">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="CBCT记录">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>增强CBCT术中记录</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;touch-action:manipulation}
html,body{margin:0;padding:0;background:#0e1726;color:#e8eef8;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{padding-bottom:200px}

/* ---------- 顶部 ---------- */
header{position:sticky;top:0;z-index:30;background:#0b1320;border-bottom:1px solid #2c3f5c;
  padding:calc(8px + env(safe-area-inset-top)) 10px 8px 10px}
#hdrMini{display:none;align-items:center;gap:8px;font-size:13px;color:#e8eef8;padding:5px 2px}
#hdrMini .mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-variant-numeric:tabular-nums}
#hdrMini .me{flex:none;font-size:11px;color:#3b82f6;border:1px solid #2b4a72;
  border-radius:6px;padding:3px 9px}
header.mini #hdrFull{display:none}
header.mini #hdrMini{display:flex}
.hrow{display:flex;gap:8px;align-items:flex-end;margin-bottom:7px}
.hrow:last-child{margin-bottom:0}
label.f{flex:1;display:flex;flex-direction:column;font-size:11px;color:#8fa3bf;gap:4px;min-width:0}
/* 统一 46px：iOS 的 input[type=date] 与 select 固有高度不同，不锁死会标签错位 */
label.f input,label.f select{background:#182437;border:1px solid #2c3f5c;color:#e8eef8;
  height:46px;padding:0 10px;font-size:16px;width:100%;min-width:0;
  border-radius:10px;box-sizing:border-box;display:block;outline:none}
label.f input::placeholder{color:#5b6f8c}
label.f input:not([type=date]),label.f select{-webkit-appearance:none;appearance:none}
label.f select{
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='9'%3E%3Cpath d='M1 1l6 6 6-6' stroke='%238fa3bf' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
.hstat{display:flex;justify-content:space-between;align-items:center;
  font-size:11px;color:#8fa3bf;padding:5px 2px 0;min-height:16px}
.saved{font-size:11px;color:#8fa3bf;white-space:nowrap}

/* ---------- 列表 ---------- */
main{padding:10px 10px 0 10px}
.card{background:#182437;border:1px solid #2c3f5c;border-radius:12px;margin-bottom:9px;overflow:hidden}
.card.open{border-color:#33507a}
.chead{display:flex;align-items:center;gap:7px;padding:9px;background:#21304a}
.seq{font-weight:700;font-size:14px;color:#0e1726;background:#8fa3bf;border-radius:6px;
  min-width:26px;height:24px;display:flex;align-items:center;justify-content:center;padding:0 6px;flex:none}
.seq.dsa{background:#3b82f6;color:#fff}
.seq.cbct{background:#22c55e;color:#06240f}
.seq.dual{background:#84cc16;color:#12210a}
.seq.ct{background:#2dd4bf;color:#04231f}
.seq.fl{background:#f59e0b;color:#2b1a00}
.chead .tname{font-weight:600;font-size:13px;flex:none}
.chead .tm{font-size:11px;color:#8fa3bf;font-variant-numeric:tabular-nums;flex:none}
.chead .sum{flex:1;min-width:0;font-size:11px;color:#8fa3bf;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.chead .grow{flex:1}
.mbtn{background:transparent;border:1px solid #2c3f5c;color:#8fa3bf;border-radius:7px;
  padding:5px 9px;font-size:12px;flex:none}
.mbtn:active{background:#26364f;color:#e8eef8}
.mbtn.d:active{background:#3a1a1a;color:#ef4444}
.body{padding:9px;display:flex;flex-direction:column;gap:9px}
.card:not(.open) .body{display:none}
.row2{display:flex;gap:9px}
.fld{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:11px;color:#8fa3bf}
.fld input{background:#12203a;border:1px solid #2c3f5c;color:#e8eef8;
  border-radius:8px;padding:9px;font-size:16px;width:100%;outline:none}
.fld input::placeholder{color:#4d6280}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #2c3f5c;background:#12203a;color:#e8eef8;border-radius:999px;
  padding:6px 11px;font-size:14px;min-height:32px;display:flex;align-items:center}
.chip.sm{padding:5px 9px;font-size:13px;min-height:30px}
.chip.on{background:#3b82f6;border-color:#3b82f6;color:#fff;font-weight:600}
.chip.on.r{background:#ef4444;border-color:#ef4444;color:#fff}
.timebar{display:flex;gap:7px;align-items:stretch}
.timebar input{flex:1;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.btnnow{flex:none;background:#16233a;border:1px solid #2c3f5c;color:#8fa3bf;
  border-radius:8px;padding:0 12px;font-size:12px}
.btnnow:active{background:#22334f;color:#e8eef8}
.hintline{font-size:11px;color:#8fa3bf;line-height:1.55}

/* ---------- 底部 ---------- */
#sum{position:fixed;left:0;right:0;bottom:calc(122px + env(safe-area-inset-bottom));
  background:rgba(11,19,32,.96);border-top:1px solid #2c3f5c;display:flex;z-index:25}
#sum div{flex:1;text-align:center;padding:6px 1px;font-size:9px;color:#8fa3bf;
  border-right:1px solid #1b2942}
#sum div:last-child{border-right:none}
#sum b{display:block;font-size:14px;color:#e8eef8;font-variant-numeric:tabular-nums}
#bar{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom)) 8px;
  background:#0b1320;border-top:1px solid #2c3f5c;z-index:26}
.btns{display:flex;gap:6px}
.btns button{flex:1;border:none;border-radius:11px;padding:12px 1px;font-size:14px;font-weight:700;
  color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.btns button small{font-size:9px;font-weight:400;opacity:.85}
.bDSA{background:linear-gradient(180deg,#3b82f6,#2563eb)}
.bCBCT{background:linear-gradient(180deg,#22c55e,#16a34a);color:#06240f!important}
.bDUAL{background:linear-gradient(180deg,#84cc16,#65a30d);color:#12210a!important}
.bCT{background:linear-gradient(180deg,#2dd4bf,#14b8a6);color:#04231f!important}
.bFL{background:linear-gradient(180deg,#f59e0b,#d97706);color:#2b1a00!important}
.tools{display:flex;gap:6px;margin-top:7px}
.tools button{flex:1;background:#16233a;border:1px solid #2c3f5c;color:#8fa3bf;
  border-radius:9px;padding:9px 2px;font-size:12px}

/* ---------- 弹层 ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end}
.sheet.on{display:flex}
.pane{background:#182437;width:100%;max-height:86vh;overflow:auto;
  border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom)) 14px}
.pane h3{margin:0 0 10px 0;font-size:16px}
.pane textarea{width:100%;height:180px;background:#12203a;color:#e8eef8;
  border:1px solid #2c3f5c;border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,monospace}
.pane button.act{width:100%;margin-top:10px;padding:13px;border-radius:11px;border:none;
  background:#3b82f6;color:#fff;font-size:15px;font-weight:600}
.pane button.sec{width:100%;margin-top:10px;padding:13px;border-radius:11px;
  background:#16233a;color:#e8eef8;border:1px solid #2c3f5c;font-size:15px}
.hist{font-size:13px;color:#8fa3bf;border-bottom:1px solid #2c3f5c;padding:10px 0;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.hist b{color:#e8eef8;font-size:14px}
.mini{background:#16233a;border:1px solid #2c3f5c;color:#e8eef8;border-radius:7px;
  padding:6px 11px;font-size:12px}
.empty{color:#8fa3bf;text-align:center;padding:24px 12px;font-size:13px;line-height:1.8}
/* 五按钮时汇总栏也挤一点 */
#sum div{font-size:8px;padding:6px 0}
#sum b{font-size:13px}
</style>
</head>
<body>

<header id="hdr">
  <div id="hdrFull">
    <div class="hrow">
      <label class="f">患者姓名<input id="pname" placeholder="张三" autocomplete="off"></label>
      <label class="f" style="flex:1.2">患者编号<input id="empi" placeholder="EMPI10180550" autocomplete="off"></label>
    </div>
    <div class="hrow">
      <label class="f" style="flex:1.1">日期<input id="date" type="date"></label>
      <label class="f" style="flex:.72">技师
        <select id="tech"><option value="">-</option><option>悦</option><option>颖</option><option>禹</option><option>梁</option><option>林</option><option>郑</option><option>其他</option></select>
      </label>
    </div>
    <div class="hrow">
      <label class="f" style="flex:1.45">设备
        <select id="device">
          <option>飞利浦Azurion7M20</option><option>飞利浦另一台</option><option>西门子</option>
          <option>佳能</option><option>联影悬吊</option><option>联影落地</option>
        </select>
      </label>
      <label class="f">手术
        <select id="surgery">
          <option>TACE</option><option>Mapping</option><option>其他</option>
        </select>
      </label>
    </div>
    <div class="hstat"><span class="saved" id="saved">已保存</span><span id="cnt">0 条</span></div>
  </div>
  <div id="hdrMini" onclick="toggleHdr()">
    <span class="mt" id="miniText">—</span>
    <span class="me">展开</span>
  </div>
</header>

<main id="runs"></main>

<div id="sum">
  <div>造影<b id="sD">0</b></div>
  <div>增强<b id="sC">0</b></div>
  <div>双期<b id="sU">0</b></div>
  <div>平扫<b id="sT">0</b></div>
  <div>透视<b id="sF">0</b></div>
  <div>对比剂<b id="sV">0</b></div>
  <div>碘量<b id="sI">0</b></div>
</div>

<div id="bar">
  <div class="btns">
    <button class="bDSA"  onclick="add('DSA')">造影<small>2D</small></button>
    <button class="bCBCT" onclick="add('CBCT')">增强<small>单期</small></button>
    <button class="bDUAL" onclick="add('DUAL')">双期<small>2次采集</small></button>
    <button class="bCT"   onclick="add('CT')">平扫<small>无对比剂</small></button>
    <button class="bFL"   onclick="add('FL')">透视<small>无注射</small></button>
  </div>
  <div class="tools">
    <button onclick="openExport()">导出 / 交接</button>
    <button onclick="openHist()">历史台次</button>
    <button onclick="newSession()">结束本台</button>
  </div>
</div>

<div class="sheet" id="shExport">
  <div class="pane">
    <h3>导出本台记录</h3>
    <div class="hintline" style="margin-bottom:8px">
      CSV 可直接用 Excel 打开（已带 BOM，中文不乱码）；也可复制文本发微信。
    </div>
    <textarea id="expArea" readonly></textarea>
    <button class="act" onclick="downloadCSV(false)">下载 CSV（完整，含姓名）</button>
    <button class="sec" onclick="downloadCSV(true)">下载 CSV（脱敏，去姓名）</button>
    <button class="sec" onclick="copyText()">复制文本</button>
    <button class="sec" onclick="closeSheet('shExport')">关闭</button>
  </div>
</div>

<div class="sheet" id="shHist">
  <div class="pane">
    <h3>历史台次与备份</h3>
    <div id="histList"></div>
    <div class="hintline" id="swState" style="margin-top:10px"></div>
    <button class="act" onclick="exportAllCSV()">导出全部台次 CSV（合并成一个文件）</button>
    <button class="sec" onclick="backupAll()">备份全部（JSON，可换手机恢复）</button>
    <button class="sec" onclick="document.getElementById('fileIn').click()">从备份恢复</button>
    <input type="file" id="fileIn" accept=".json,application/json" style="display:none" onchange="restoreAll(this)">
    <button class="sec" onclick="forceRefresh()">强制更新到最新版（清离线缓存，数据不丢）</button>
    <button class="sec" onclick="closeSheet('shHist')">关闭</button>
  </div>
</div>

<div class="sheet" id="shIns">
  <div class="pane">
    <h3>在这一条之前补插</h3>
    <button class="act" onclick="doInsert('DSA')">补插一次造影</button>
    <button class="act" style="background:#22c55e;color:#06240f" onclick="doInsert('CBCT')">补插一次增强CBCT</button>
    <button class="act" style="background:#84cc16;color:#12210a" onclick="doInsert('DUAL')">补插一次双期CBCT</button>
    <button class="act" style="background:#2dd4bf;color:#04231f" onclick="doInsert('CT')">补插一次平扫CBCT</button>
    <button class="act" style="background:#f59e0b;color:#2b1a00" onclick="doInsert('FL')">补插一次透视</button>
    <button class="sec" onclick="closeSheet('shIns')">取消</button>
  </div>
</div>

<script>
"use strict";
var APP_VER="v8";
var LS_CUR="cbct_cur_v4", LS_HIST="cbct_hist_v4";

/* 导管位置按手术推进顺序排列：
   腹腔干 -> 肝总/肝固有 -> 一次超选(肝左右中、膈) -> 二次超选(左内左外、右前右后) -> 段/亚段 */
var CAT=["腹腔干动脉","肝总动脉","肝固有动脉",
         "肝右动脉","肝左动脉","肝中动脉","膈动脉",
         "左内支","左外支","右前支","右后支",
         "段动脉","亚段动脉","胆囊动脉","其他动脉",
         "仅透视未造影","无法判断"];
var PURPOSE=["首次造影","超选后确认","栓塞后确认","空跑试旋转","重扫补做"];
var STAIN=["好","一般","差"];
var CONC=[300,350,370];
/* 流速 / 总量 / 延迟 —— 按术中实际常用值排列 */
var FLOW_P=[0.5,0.8,1,1.2,1.5,1.8,2,2.5,3,3.5,4,5];
var VOL_P=[3,4,5,6,7,8,9,10,15,18,20,25];
var INJ_P=[0,1,2,3,5,8];           /* 注射延迟常用值 */
var EXP_P=[3,4,5,6,8,10,11,12,14,16]; /* 曝光延迟常用值 */

var TYPE_NAME={DSA:"造影",CBCT:"增强CBCT",DUAL:"双期CBCT",CT:"平扫CBCT",FL:"透视"};
var TYPE_CAT={DSA:"DSA",CBCT:"增强CBCT",DUAL:"双期CBCT",CT:"平扫CBCT",FL:"透视"};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return (n<10?"0":"")+n}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function nowStr(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
/* 机台时间输入：930 / 9:30 / 0930 / 093012 都归一成 HH:MM
   机台上只看得到分，录秒既麻烦又记不准，所以只要到分钟。
   小时可能是 1 位（9 点），要先补零再切。 */
function fmtTime(v){
  var s=String(v||"").replace(/\D/g,"");
  if(!s)return "";
  if(s.length>4)s=s.slice(0,4);     /* 多打了秒也截掉 */
  if(s.length===3)s="0"+s;          /* H MM -> 补零成 4 位 */
  if(s.length<=2)return s;
  return s.slice(0,2)+":"+s.slice(2,4);
}

var S=(function(){
  try{var t=localStorage.getItem(LS_CUR);if(t)return JSON.parse(t)}catch(e){}
  return {id:uid(),pname:"",empi:"",date:todayStr(),tech:"",device:"飞利浦Azurion7M20",surgery:"TACE",
          runs:[],hdrMini:false};
})();
if(!S.runs)S.runs=[];
if(!S.surgery)S.surgery="TACE";   /* v6 以前的存档没这个字段 */
/* v7 及以前只有一个「延迟」，含义上最接近曝光延迟，迁移到 exp_delay */
S.runs.forEach(function(r){
  if(r.delay!==undefined && r.exp_delay===undefined){ r.exp_delay=r.delay||""; delete r.delay; }
  if(r.exp_delay===undefined){ r.exp_delay=""; }
  if(r.inj_delay===undefined){ r.inj_delay=""; }
  if(r.exp_delay2===undefined){ r.exp_delay2=""; }
  if(!r.n_acq){ r.n_acq=(r.type==="DUAL"?2:1); }
});

function histData(){try{return JSON.parse(localStorage.getItem(LS_HIST)||"[]")}catch(e){return[]}}

var saveTimer=null;
function save(){
  localStorage.setItem(LS_CUR,JSON.stringify(S));
  var el=document.getElementById("saved");
  el.textContent="已保存 "+nowStr();el.style.color="#22c55e";
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){el.style.color="#8fa3bf"},1500);
  renderSum();renderHdr();
}

["pname","empi","date","tech","device","surgery"].forEach(function(k){
  var el=document.getElementById(k);
  el.value=S[k]||"";
  var h=function(){S[k]=el.value;save()};
  el.addEventListener("input",h);el.addEventListener("change",h);
});

/* ---------------- 顶部折叠 ---------------- */
function toggleHdr(){
  S.hdrMini=!S.hdrMini;
  document.getElementById("hdr").classList.toggle("mini",!!S.hdrMini);
  save();
}
function renderHdr(){
  var t=[];
  if(S.pname)t.push(S.pname);
  if(S.empi)t.push(S.empi);
  if(S.tech)t.push(S.tech);
  if(S.surgery)t.push(S.surgery);
  t.push(S.runs.length+" 条");
  t.push(APP_VER);
  document.getElementById("miniText").textContent=t.join(" · ");
  document.getElementById("hdr").classList.toggle("mini",!!S.hdrMini);
}

/* ---------------- 增删改 ---------------- */
function prevParam(i){
  for(var k=i-1;k>=0;k--){
    var r=S.runs[k];
    if(r.type==="CBCT"||r.type==="DSA")return r;
  }
  return null;
}
function mkRun(type,anchor){
  var p=anchor||{catheter:"",flow:"",volume:"",conc:"350"};
  var r={seq:0,time:nowStr(),mtime:"",type:type,
    catheter:p.catheter||"",flow:p.flow||"",volume:p.volume||"",
    /* 延迟拆两个：注射延迟（注射器上设的）+ 曝光延迟（机台上设的） */
    inj_delay:"",exp_delay:"",exp_delay2:"",
    n_acq:(type==="DUAL"?2:1),
    conc:p.conc||"350",purpose:"",phase:"",rescan:"",stain:"",note:"",
    series:"",open:true};
  if(type==="CBCT"||type==="DSA"){r.flow=r.flow||"1.5";r.volume=r.volume||"6"}
  if(type==="FL"){r.catheter="仅透视未造影";r.flow="";r.volume="";r.conc=""}
  /* 平扫也保留导管位置（技师要据此核对导管与碘油沉积） */
  if(type==="CT"){r.flow="";r.volume="";r.conc="";r.purpose="平扫"}
  if(type==="DUAL"){r.flow=r.flow||"1.5";r.volume=r.volume||"6";r.purpose="双期"}
  return r;
}
function renumber(){S.runs.forEach(function(x,k){x.seq=k+1})}
function collapseAll(){S.runs.forEach(function(x){x.open=false})}
function add(type){
  collapseAll();
  var r=mkRun(type,prevParam(S.runs.length));
  S.runs.push(r);renumber();
  if(S.runs.length===1)S.hdrMini=true;   /* 首条之后自动收顶部，把屏幕让给列表 */
  save();render();
  var m=document.getElementById("runs");
  if(m.lastElementChild)m.lastElementChild.scrollIntoView({behavior:"smooth",block:"center"});
}
var pendIns=-1;
function askInsert(i){pendIns=i;document.getElementById("shIns").classList.add("on")}
function doInsert(type){
  if(pendIns<0){closeSheet("shIns");return}
  var r=mkRun(type,prevParam(pendIns));
  S.runs.splice(pendIns,0,r);renumber();
  collapseAll();r.open=true;
  closeSheet("shIns");save();render();pendIns=-1;
}
function del(i){
  if(!confirm("删除第 "+(i+1)+" 条？"))return;
  S.runs.splice(i,1);renumber();save();render();
}
function toggleCard(i,ev){
  if(ev&&ev.target&&ev.target.tagName==="BUTTON")return;
  S.runs[i].open=!S.runs[i].open;save();render();
}

/* ---------------- 渲染 ---------------- */
function summaryOf(r){
  var t=[];
  if(r.catheter)t.push(r.catheter);
  if(r.type==="CBCT"||r.type==="DSA"){
    if(r.flow)t.push(r.flow+"mL/s");
    if(r.volume)t.push(r.volume+"mL");
  }
  if(r.type==="CBCT"||r.type==="DUAL"){
    if(r.inj_delay!=="")t.push("注"+r.inj_delay+"s");
    if(r.exp_delay!=="")t.push("曝"+r.exp_delay+"s");
    if(r.type==="DUAL"&&r.exp_delay2!=="")t.push("曝2:"+r.exp_delay2+"s");
  }
  if((r.type==="CBCT"||r.type==="DUAL")&&r.purpose)t.push(r.purpose);
  if(r.series)t.push("序"+r.series);
  if(r.rescan)t.push(r.rescan);
  return t.join(" ");
}
function render(){
  var m=document.getElementById("runs");
  if(!S.runs.length){
    m.innerHTML='<div class="empty">还没有记录。<br><br>按手术实际顺序点下方按钮：<br>'+
      '<span style="color:#3b82f6">造影</span> · <span style="color:#22c55e">增强</span> · '+
      '<span style="color:#84cc16">双期</span> · <span style="color:#2dd4bf">平扫</span> · '+
      '<span style="color:#f59e0b">透视</span><br><br>'+
      '造影和CBCT交错记，顺序就是手术顺序。<br>'+
      '漏了一条？点卡片上的「↑」在它前面补插。<br><br>'+
      '<span style="color:#8fa3bf">每条都要填「机台序列时间」，<br>'+
      '它比手机时间可靠，是跟影像对号的依据。</span></div>';
    renderSum();renderHdr();return;
  }
  var h="";
  for(var i=0;i<S.runs.length;i++)h+=card(S.runs[i],i);
  m.innerHTML=h;
  renderSum();renderHdr();
}
function chipHTML(i,key,val,label,on,color,sm){
  return '<button class="chip'+(sm?" sm":"")+(on?" on"+(color?" "+color:""):"")+
    '" data-i="'+i+'" data-k="'+key+'" data-v="'+esc(val)+'" onclick="pick(this)">'+esc(label)+'</button>';
}
function pick(el){
  var i=+el.getAttribute("data-i"),k=el.getAttribute("data-k"),v=el.getAttribute("data-v");
  S.runs[i][k]=v;
  if(k==="purpose"){if(v!=="双期")S.runs[i].phase="";save();render();return}
  if(k==="rescan"||k==="catheter"||k==="stain"||k==="phase"){save();render();return}
  save();refreshChips(i,k);
}
function refreshChips(i,k){
  var nodes=document.querySelectorAll('[data-i="'+i+'"][data-k="'+k+'"]');
  var cur=S.runs[i][k]==null?"":String(S.runs[i][k]);
  for(var n=0;n<nodes.length;n++){
    var v=nodes[n].getAttribute("data-v");
    var base=(nodes[n].className.indexOf("sm")>=0)?"chip sm":"chip";
    nodes[n].className=(v===cur)?base+" on"+(k==="rescan"?" r":""):base;
  }
}
function setText(i,k,val){
  S.runs[i][k]=val;save();
  if(k==="inj_delay"||k==="exp_delay"||k==="exp_delay2"||
     k==="flow"||k==="volume"||k==="conc")refreshChips(i,k);
}
function setTime(i,val){
  S.runs[i].mtime=fmtTime(val);save();
  var el=document.getElementById("mt"+i);
  if(el&&el.value!==S.runs[i].mtime)el.value=S.runs[i].mtime;
}
function nowFor(i){
  S.runs[i].mtime=nowStr();save();
  var el=document.getElementById("mt"+i);
  if(el)el.value=S.runs[i].mtime;
}
function timeField(r,i){
  return '<div class="fld"><span>机台序列时间 HH:MM（看机台上显示的采集时间）</span>'+
    '<div class="timebar">'+
    '<input id="mt'+i+'" inputmode="numeric" placeholder="HH:MM" maxlength="5" value="'+esc(r.mtime)+'" '+
    'oninput="setTime('+i+',this.value)">'+
    '<button class="btnnow" onclick="nowFor('+i+')">现在</button></div></div>';
}

/* 一个「芯片 + 手输框」的数值字段，减少重复 */
function numField(i,key,label,presets,val,ph){
  var b='<div class="fld"><span>'+label+'</span><div class="chips">';
  presets.forEach(function(c){b+=chipHTML(i,key,c,c,String(val)===String(c),"","sm")});
  b+='</div><input inputmode="decimal" value="'+esc(val)+'" placeholder="'+(ph||"其他数值")+
     '" oninput="setText('+i+',\''+key+'\',this.value)"></div>';
  return b;
}

function card(r,i){
  var cls=r.type==="CBCT"?"cbct":(r.type==="DUAL"?"dual":
          (r.type==="DSA"?"dsa":(r.type==="CT"?"ct":"fl")));
  var opened=r.open!==false;
  var b='<div class="card'+(opened?" open":"")+'"><div class="chead" onclick="toggleCard('+i+',event)">'+
    '<span class="seq '+cls+'">'+r.seq+'</span>'+
    '<span class="tname">'+TYPE_NAME[r.type]+'</span>'+
    (r.mtime?'<span class="tm">'+esc(r.mtime)+'</span>':'')+
    (opened?'<span class="grow"></span>':'<span class="sum">'+esc(summaryOf(r))+'</span>')+
    '<button class="mbtn" onclick="event.stopPropagation();askInsert('+i+')">↑</button>'+
    '<button class="mbtn d" onclick="event.stopPropagation();del('+i+')">删</button>'+
    '</div><div class="body">';

  if(r.type==="FL"){
    b+=timeField(r,i);
    b+='<div class="hintline">透视只作流水记录。导管位置如有需要，写在下面备注里即可（非必填）。</div>';
  }else if(r.type==="CT"){
    b+='<div class="fld"><span>导管位置</span><div class="chips">';
    CAT.forEach(function(c){b+=chipHTML(i,"catheter",c,c,r.catheter===c,"","")});
    b+='</div></div>';
    b+='<div class="fld"><span>机台序列号</span><input inputmode="numeric" value="'+esc(r.series)+
       '" oninput="setText('+i+',\'series\',this.value)" placeholder="机台屏幕上的序列号"></div>';
    b+=timeField(r,i);
    b+='<div class="hintline">平扫 CBCT：未注射对比剂，不需要流速 / 总量 / 延迟 / 浓度。</div>';
  }else{
    b+='<div class="fld"><span>导管位置</span><div class="chips">';
    CAT.forEach(function(c){b+=chipHTML(i,"catheter",c,c,r.catheter===c,"","")});
    b+='</div></div>';

    /* ---- 延迟：注射延迟 + 曝光延迟 ---- */
    if(r.type==="CBCT"||r.type==="DUAL"){
      b+=numField(i,"inj_delay","注射延迟（秒）· 注射器上设的",INJ_P,r.inj_delay,"秒");
      b+=numField(i,"exp_delay",
                  (r.type==="DUAL"?"曝光延迟（秒）· 第一相":"曝光延迟（秒）· 机台上设的"),
                  EXP_P,r.exp_delay,"秒");
      if(r.type==="DUAL"){
        b+=numField(i,"exp_delay2","曝光延迟（秒）· 第二相",EXP_P,r.exp_delay2,"秒");
      }
    }

    b+=numField(i,"flow","流速 mL/s",FLOW_P,r.flow,"mL/s");
    b+=numField(i,"volume","总量 mL",VOL_P,r.volume,"mL");

    if(r.type==="CBCT"||r.type==="DUAL"){
      b+='<div class="fld"><span>机台序列号</span><input inputmode="numeric" value="'+esc(r.series)+
         '" oninput="setText('+i+',\'series\',this.value)" placeholder="机台屏幕上的序列号"></div>';
      b+=timeField(r,i);
      b+=numField(i,"conc","浓度 mgI/mL",CONC,r.conc,"mgI/mL");
      b+='<div class="fld"><span>采集目的</span><div class="chips">';
      PURPOSE.forEach(function(c){b+=chipHTML(i,"purpose",c,c,r.purpose===c,"","sm")});
      b+='</div></div>';
      if(r.type==="DUAL"){
        b+='<div class="hintline">一次双期 = 机台上做 2 次旋转采集（对应 2 个 DICOM 序列）。'
          +'本行按「一次注射 + 两个曝光延迟」记录，导出时「对应采集数」会自动记 2。</div>';
      }
      b+='<div class="fld"><span>重扫 / 废弃</span><div class="chips">'+
         chipHTML(i,"rescan","","无",r.rescan==="","","sm")+
         chipHTML(i,"rescan","重扫","重扫",r.rescan==="重扫","r","sm")+
         chipHTML(i,"rescan","废弃","废弃",r.rescan==="废弃","r","sm")+
         '</div></div>';
    }else{
      b+=timeField(r,i);
      b+='<div class="fld"><span>染色</span><div class="chips">';
      STAIN.forEach(function(c){b+=chipHTML(i,"stain",c,c,r.stain===c,"","sm")});
      b+='</div></div>';
    }
  }
  b+='<div class="fld"><span>备注</span><input value="'+esc(r.note)+
     '" oninput="setText('+i+',\'note\',this.value)" placeholder="可空"></div>';
  return b+'</div></div>';
}

/* ---------------- 汇总 ---------------- */
function renderSum(){
  var d=0,c=0,u=0,t=0,f=0,v=0,iod=0;
  S.runs.forEach(function(r){
    if(r.type==="DSA")d++;
    else if(r.type==="CBCT")c++;
    else if(r.type==="DUAL")u++;
    else if(r.type==="CT")t++;
    else f++;
    var vv=parseFloat(r.volume);
    if(!isNaN(vv)){
      v+=vv;
      var cc=parseFloat(r.conc);
      if((r.type==="CBCT"||r.type==="DUAL")&&!isNaN(cc))iod+=vv*cc/1000;
    }
  });
  document.getElementById("sD").textContent=d;
  document.getElementById("sC").textContent=c;
  document.getElementById("sU").textContent=u;
  document.getElementById("sT").textContent=t;
  document.getElementById("sF").textContent=f;
  document.getElementById("sV").textContent=(Math.round(v*10)/10)+"mL";
  document.getElementById("sI").textContent=(Math.round(iod*10)/10)+"g";
  document.getElementById("cnt").textContent=S.runs.length+" 条 · "+APP_VER;
}

/* ---------------- 导出 ---------------- */
var HEAD=["会话ID","患者编号","患者姓名","日期","设备","手术","技师","轮次","记录时刻","机台时间",
          "类型","导管位置","机台序列号","流速mL/s","总量mL",
          "注射延迟s","曝光延迟s","第二相曝光延迟s","对应采集数","浓度mgI/mL",
          "采集目的","时相","重扫","染色","备注"];
function rowOf(s,r,mask){
  return [s.id,s.empi,mask?"":(s.pname||""),s.date,s.device,s.surgery,s.tech,r.seq,r.time,r.mtime,
    TYPE_CAT[r.type]||r.type,r.catheter,r.series,r.flow,r.volume,
    r.inj_delay,r.exp_delay,r.exp_delay2,(r.n_acq||1),r.conc,
    r.purpose,r.phase,r.rescan,r.stain,r.note];
}
function dataRows(mask){return S.runs.map(function(r){return rowOf(S,r,mask)})}
function allSessions(){return [JSON.parse(JSON.stringify(S))].concat(histData())}
function allRows(mask){
  var out=[];
  allSessions().forEach(function(s){(s.runs||[]).forEach(function(r){out.push(rowOf(s,r,mask))})});
  return out;
}
function csvCell(v){
  var s=String(v==null?"":v);
  return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function buildCSV(rows){
  return "\ufeff"+[HEAD].concat(rows).map(function(r){
    return r.map(csvCell).join(",")}).join("\r\n");
}
function toTSV(){
  return [HEAD].concat(dataRows(false)).map(function(r){
    return r.map(function(x){return String(x==null?"":x).replace(/\t/g," ")}).join("\t");
  }).join("\n");
}
function openExport(){
  document.getElementById("expArea").value=toTSV();
  document.getElementById("shExport").classList.add("on");
}
function closeSheet(id){document.getElementById(id).classList.remove("on")}
function safeName(){
  var n=(S.empi||S.pname||"NA").replace(/[^\w\u4e00-\u9fa5-]/g,"");
  return n||"NA";
}
function tsName(){
  var d=new Date();
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"_"+pad(d.getHours())+pad(d.getMinutes());
}
function saveBlob(blob,name){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);if(a.parentNode)a.parentNode.removeChild(a)},1500);
}
function downloadCSV(mask){
  var name="CBCT_"+safeName()+"_"+(S.date||todayStr())+(mask?"_脱敏":"")+".csv";
  saveBlob(new Blob([buildCSV(dataRows(!!mask))],{type:"text/csv;charset=utf-8"}),name);
}
function copyText(){
  var ta=document.getElementById("expArea"),ok=false;
  ta.select();ta.setSelectionRange(0,999999);
  try{ok=document.execCommand("copy")}catch(e){}
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(toTSV());ok=true}
  alert(ok?"已复制，可直接粘贴到微信或 Excel":"请长按文本框手动复制");
}
function exportAllCSV(){
  var rows=allRows(false);
  if(!rows.length){alert("还没有任何记录");return}
  saveBlob(new Blob([buildCSV(rows)],{type:"text/csv;charset=utf-8"}),
           "CBCT_全部台次_"+tsName()+".csv");
}
function backupAll(){
  var data={v:2,exported:new Date().toISOString(),sessions:allSessions()};
  saveBlob(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}),
           "CBCT_备份_"+tsName()+".json");
  alert("已导出备份，共 "+data.sessions.length+" 台。\n建议同时发一份到微信或网盘。");
}
function restoreAll(inp){
  var f=inp.files&&inp.files[0];
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      var arr=d.sessions||(Array.isArray(d)?d:[]);
      if(!arr.length)throw new Error("文件里没有台次");
      var h2=histData(),byId={};
      h2.forEach(function(s){byId[s.id]=s;if(!s.surgery)s.surgery="TACE"});
      var merged=0;
      arr.forEach(function(s){
        if(!s||!s.id)return;
        /* 旧版本导出的存档没有 surgery / runs，这里补齐，
           否则推进历史列表的那些台次手术列会是空 */
        if(!s.runs)s.runs=[];
        if(!s.surgery)s.surgery="TACE";
        if(s.id===S.id){S=s;return}
        if(!byId[s.id]){h2.push(s);byId[s.id]=s;merged++}
      });
      localStorage.setItem(LS_HIST,JSON.stringify(h2));
      if(!S.runs)S.runs=[];
      save();
      if(!S.surgery)S.surgery="TACE";
      ["pname","empi","date","tech","device","surgery"].forEach(function(k){
        var el=document.getElementById(k);if(el)el.value=S[k]||"";
      });
      render();closeSheet("shHist");
      alert("已读入 "+arr.length+" 台，新增 "+merged+" 台，历史共 "+h2.length+" 台。");
    }catch(e){alert("备份文件读取失败："+e.message)}
  };
  rd.readAsText(f);
  inp.value="";
}

/* ---------------- 强制更新 ---------------- */
function forceRefresh(){
  if(!confirm("清除离线缓存并重新加载？\n\n已录入的数据保存在本地存储里，不会丢。\n升级版本后手机上打不开新版时，点这里。"))return;
  var jobs=[];
  try{
    jobs.push(caches.keys().then(function(ks){
      return Promise.all(ks.map(function(k){return caches.delete(k)}));
    }));
  }catch(e){}
  if("serviceWorker" in navigator){
    jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
      return Promise.all(rs.map(function(r){return r.unregister()}));
    }));
  }
  Promise.all(jobs).catch(function(){}).then(function(){
    location.replace(location.pathname+"?v="+Date.now());
  });
}

/* 新 SW 接管后重载一次 */
(function(){
  var done=false;
  try{
    if(!("serviceWorker" in navigator)||!navigator.serviceWorker.addEventListener)return;
    navigator.serviceWorker.addEventListener("controllerchange",function(){
      if(done)return;done=true;
      if(document.visibilityState==="hidden")return;
      location.reload();
    });
  }catch(e){}
})();

/* ---------------- 台次 ---------------- */
function newSession(){
  if(!S.runs.length){alert("本台还没有记录");return}
  if(!confirm("结束本台并存档？\n存档后开一张新表（下一位患者）。"))return;
  var h=histData();h.unshift(JSON.parse(JSON.stringify(S)));
  localStorage.setItem(LS_HIST,JSON.stringify(h));
  var keepTech=S.tech,keepDev=S.device;
  /* 技师与设备沿用，手术类型重置为 TACE —— 它是绝大多数情况，
     若沿用上一台的 Mapping，很容易把整台病例的术式记错 */
  S={id:uid(),pname:"",empi:"",date:todayStr(),tech:keepTech,device:keepDev,
     surgery:"TACE",runs:[],hdrMini:false};
  ["pname","empi"].forEach(function(k){
    var el=document.getElementById(k);if(el)el.value="";
  });
  document.getElementById("surgery").value=S.surgery;
  document.getElementById("date").value=S.date;
  save();render();
  alert("已存档。记得先点「导出」把 CSV 发出去，再开下一位。");
}
function openHist(){
  var h=histData(),box=document.getElementById("histList");
  if(!h.length){box.innerHTML='<div class="empty">还没有存档的台次</div>'}
  else{
    box.innerHTML=h.map(function(s,i){
      var iod=0;
      (s.runs||[]).forEach(function(r){
        var v=parseFloat(r.volume),c=parseFloat(r.conc);
        if((r.type==="CBCT"||r.type==="DUAL")&&!isNaN(v)&&!isNaN(c))iod+=v*c/1000;
      });
      return '<div class="hist"><div><b>'+esc(s.pname||"(无姓名)")+'</b> '+esc(s.empi||"")+
        ' · '+esc(s.date)+' · '+(s.runs||[]).length+' 条 · 碘 '+Math.round(iod*10)/10+' g</div>'+
        '<button class="mini" onclick="restore('+i+')">载入</button></div>';
    }).join("");
  }
  document.getElementById("shHist").classList.add("on");
}
function restore(i){
  var h=histData();
  if(!h[i])return;
  if(!confirm("载入这一台？当前未存档的记录会被覆盖。"))return;
  S=h[i];if(!S.runs)S.runs=[];
  if(!S.surgery)S.surgery="TACE";
  save();
  ["pname","empi","date","tech","device","surgery"].forEach(function(k){
    var el=document.getElementById(k);if(el)el.value=S[k]||"";
  });
  render();closeSheet("shHist");
}

/* ---------------- Service Worker ---------------- */
(function(){
  var el=document.getElementById("swState");
  function say(t){if(el)el.textContent=t}
  if(!("serviceWorker" in navigator)){say("离线缓存：浏览器不支持");return}
  if(!window.isSecureContext){
    say("离线缓存未启用：需通过 https 或 localhost 访问（当前是 http 局域网地址）。"
        +"加主屏幕后仍可正常使用，但断网时打不开。");
    return;
  }
  var ready=false;
  navigator.serviceWorker.ready.then(function(){
    ready=true;say("离线缓存：已启用（断网也能打开）· "+APP_VER);
  });
  navigator.serviceWorker.register("sw.js").catch(function(e){
    say("离线缓存注册失败："+e.message);
  });
  setTimeout(function(){
    if(!ready){
      say("离线缓存尚未就绪：常见原因是 icons 目录没上传全（预缓存要求每个文件都存在），"
          +"或首次加载还没完成。不影响记录与导出。");
    }
  },8000);
})();

document.getElementById("date").value=S.date||todayStr();
render();
</script>
